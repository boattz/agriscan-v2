services:
  - type: web
    name: agriscan-v2
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: API_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: agriscan-db
          property: connectionString
      # ── LINE Alerts — ส่งหาผู้ลงทะเบียนเท่านั้น (multicast) ──
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false # Channel Access Token จาก LINE Developers → Messaging API
      - key: LINE_CHANNEL_SECRET
        sync: false # Channel secret (ตรวจ webhook signature) — ไม่ตั้งก็ใช้ได้
      - key: LINE_ADD_FRIEND_URL
        value: https://line.me/R/ti/p/@500vdtpt # ปุ่มเพิ่มเพื่อน OA บน dashboard
      - key: ALERT_CROP
        value: other # key ตาม dashboard/crops.js (rice, corn, …)
      - key: ALERT_MIN_SEVERITY
        value: warn # warn = เอาหมด · alert = เฉพาะวิกฤต
      - key: ALERT_COOLDOWN_MIN
        value: 60 # alert เดิมส่งซ้ำได้ทุก 60 นาที (กันเปลืองโควต้า 200/เดือน)
      - key: DASHBOARD_PUBLIC_URL
        value: https://agriscan-v2.onrender.com

databases:
  - name: agriscan-db
    plan: free
    databaseName: agriscan
    user: agriscan
