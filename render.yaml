services:
  - type: web
    name: agriscan-v2
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: API_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false # Neon pooled connection string (postgres://...?sslmode=require)
      # ── LINE Alerts — ส่งหาผู้ลงทะเบียนเท่านั้น (multicast) ──
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false # Channel Access Token จาก LINE Developers → Messaging API
      - key: LINE_CHANNEL_SECRET
        sync: false # Channel secret (ตรวจ webhook signature) — ไม่ตั้งก็ใช้ได้
      - key: LINE_ADD_FRIEND_URL
        value: https://line.me/R/ti/p/@500vdtpt # ปุ่มเพิ่มเพื่อน OA บน dashboard
      - key: ALERT_CROP
        value: other # default ตั้งต้น — เปลี่ยนได้ตลอดบน dashboard (ทุกพืช)
      - key: ALERT_MIN_SEVERITY
        value: alert # alert = เฉพาะเรื่องสำคัญ · warn = รวมเตือนเฝ้าระวังด้วย
      - key: ALERT_COOLDOWN_MIN
        value: 60 # กัน flapping (หายแล้วเป็นใหม่ถี่ๆ) — ปกติเตือนครั้งเดียวต่อรอบอยู่แล้ว
      - key: DASHBOARD_PUBLIC_URL
        value: https://agriscan-v2.onrender.com
