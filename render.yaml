services:
  - type: web
    name: agriscan-v2
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: API_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: agriscan-db
          property: connectionString

databases:
  - name: agriscan-db
    plan: free
    databaseName: agriscan
    user: agriscan
